<div class="view-section">
    <!-- Page Header -->
    <div class="page-header">
        <h1 class="page-title">📚 MUST Central Library Catalog</h1>
        <p class="page-subtitle">Browse and borrow from our collection of software engineering books</p>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper">
        <div class="search-input-group">
            <span class="search-icon">🔍</span>
            <input type="text" id="librarySearch" onkeyup="filterBooks()"
                placeholder="Search by title, author, or topic...">
        </div>
    </div>

    <!-- Book Grid -->
    <div class="book-shelf" id="bookShelf">
        <div class="loading">
            Loading library catalog...
        </div>
    </div>
</div>

<script>
    // Local state for books
    window.allBooks = [];

    async function fetchBooks() {
        try {
            const response = await fetch('/api/books');
            const data = await response.json();

            if (data.success) {
                window.allBooks = data.books;
                displayBooks(window.allBooks);
            } else {
                document.getElementById('bookShelf').innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">📚</div>
                        <h3>Error loading books</h3>
                        <p>Please try refreshing the page</p>
                    </div>`;
            }
        } catch (error) {
            console.error('Fetch error:', error);
            document.getElementById('bookShelf').innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <div class="empty-state-icon">⚠️</div>
                    <h3>Connection error</h3>
                    <p>Could not connect to the server. Please check your connection.</p>
                </div>`;
        }
    }

    function displayBooks(books) {
        const shelf = document.getElementById('bookShelf');

        if (books.length === 0) {
            shelf.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <div class="empty-state-icon">🔍</div>
                    <h3>No books found</h3>
                    <p>Try adjusting your search criteria</p>
                </div>`;
            return;
        }

        shelf.innerHTML = books.map(book => `
            <div class="book-item" onclick="viewBookDetails(${book.id})">
                <div class="book-cover-art">
                    ${book.image_url
                ? `<img src="${book.image_url}" alt="${book.title}">`
                : `<span>${book.title}</span>`
            }
                </div>
                <div class="book-details">
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    <div class="book-footer">
                        <span class="book-tag">${book.department}</span>
                        <button onclick="event.stopPropagation(); borrowBook(${book.id}, '${book.title.replace(/'/g, "\\'")}');" 
                                class="borrow-btn">
                            Borrow
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterBooks() {
        const searchTerm = document.getElementById('librarySearch').value.toLowerCase();
        const filtered = window.allBooks.filter(book =>
            book.title.toLowerCase().includes(searchTerm) ||
            book.author.toLowerCase().includes(searchTerm) ||
            book.department.toLowerCase().includes(searchTerm) ||
            (book.topics && book.topics.toLowerCase().includes(searchTerm))
        );
        displayBooks(filtered);
    }

    function viewBookDetails(bookId) {
        window.location.href = `/must_book_details_page/index.html?id=${bookId}`;
    }

    // Borrow a book
    async function borrowBook(bookId, bookTitle) {
        const studentId = sessionStorage.getItem('student_id');

        if (!studentId) {
            alert('Please login to borrow books.');
            window.location.href = '../must_student_login/login.html';
            return;
        }

        try {
            const response = await fetch('/api/borrowings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_id: studentId, book_id: bookId })
            });

            const data = await response.json();

            if (data.success) {
                alert(`✅ "${bookTitle}" borrowed successfully!\n\nDue date: ${data.due_date}`);
                fetchBooks(); // Refresh to show updated availability
            } else {
                alert(`❌ ${data.message}`);
            }
        } catch (error) {
            console.error('Error borrowing book:', error);
            alert('An error occurred. Please try again.');
        }
    }

    // Start fetching
    fetchBooks();
</script>
