<div class="view-section">
    <div class="profile-container">
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">
                    👤
                </div>
                <div class="profile-info">
                    <h2 id="profileName">Student Name</h2>
                    <p id="profileId">MUST-2024-XXX</p>
                </div>
            </div>
        </div>

        <!-- Borrowed Books Section -->
        <div class="borrowings-section">
            <h3>📖 Currently Borrowed Books</h3>
            <div id="borrowingsContainer">
                <div class="loading">
                    Loading your borrowed books...
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateProfileData() {
        const name = sessionStorage.getItem('student_name') || 'Guest Student';
        const id = sessionStorage.getItem('student_id') || 'MUST-2024-OFFLINE';
        const firstName = name.split(' ')[0];

        document.getElementById('profileName').textContent = name;
        document.getElementById('profileId').textContent = id;
        document.getElementById('profileAvatar').textContent = firstName.charAt(0).toUpperCase();
    }

    async function loadBorrowedBooks() {
        const studentId = sessionStorage.getItem('student_id');
        const container = document.getElementById('borrowingsContainer');

        if (!studentId) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🔒</div>
                    <h3>Not logged in</h3>
                    <p>Please login to view your borrowed books</p>
                </div>`;
            return;
        }

        try {
            const response = await fetch(`/api/borrowings/${studentId}`);
            const data = await response.json();

            if (data.success) {
                if (data.borrowings.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📚</div>
                            <h3>No books borrowed yet</h3>
                            <p>Visit the Dashboard to browse and borrow books!</p>
                        </div>`;
                } else {
                    displayBorrowings(data.borrowings);
                }
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Error loading borrowings</h3>
                        <p>${data.message || 'Please try again later'}</p>
                    </div>`;
            }
        } catch (error) {
            console.error('Error fetching borrowings:', error);
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <h3>Connection error</h3>
                    <p>Could not load your borrowed books. Please check your connection.</p>
                </div>`;
        }
    }

    function displayBorrowings(borrowings) {
        const container = document.getElementById('borrowingsContainer');
        const today = new Date();

        const tableHTML = `
            <div class="borrowings-table">
                <table>
                    <thead>
                        <tr>
                            <th>Book</th>
                            <th>Author</th>
                            <th>Borrowed</th>
                            <th>Due Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${borrowings.map(b => {
            const dueDate = new Date(b.due_date);
            const isOverdue = b.status === 'active' && dueDate < today;
            const status = isOverdue ? 'overdue' : b.status;

            return `
                                <tr>
                                    <td>
                                        <div class="book-info">
                                            ${b.image_url
                    ? `<img src="${b.image_url}" alt="${b.title}" class="book-cover-small">`
                    : `<div class="book-cover-small"></div>`
                }
                                            <div class="book-text">
                                                <h4>${b.title}</h4>
                                                <p>${b.department}</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td>${b.author}</td>
                                    <td>${new Date(b.borrowed_date).toLocaleDateString()}</td>
                                    <td>${dueDate.toLocaleDateString()}</td>
                                    <td>
                                        <span class="status-badge status-${status}">
                                            ${status === 'active' ? 'Active' :
                    status === 'returned' ? 'Returned' :
                        status === 'overdue' ? 'Overdue' : status}
                                        </span>
                                    </td>
                                </tr>
                            `;
        }).join('')}
                    </tbody>
                </table>
            </div>
        `;

        container.innerHTML = tableHTML;
    }

    // Auto-initialize
    updateProfileData();
    loadBorrowedBooks();
</script>
