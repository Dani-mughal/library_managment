  </text>
  <line x1="50" y1="180" x2="250" y2="180" stroke="#333" stroke-width="1" opacity="0.3" />
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="16" fill="#333" opacity="0.8" text-anchor="middle">Andrew Stellman</text>
  <circle cx="150" cy="300" r="40" fill="none" stroke="#333" stroke-width="2" opacity="0.2" />
